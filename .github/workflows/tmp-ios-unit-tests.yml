# TEMP for #115: remove before merge.
name: TEMP iOS unit tests
on:
  push:
    branches: [115-ios-api-key-rotation]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
      - name: Unit tests
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS-26' in k for x in v if x['name'].startswith('iPhone')))")
          set -o pipefail
          xcodebuild test -project ios/FinePrint.xcodeproj -scheme FinePrint \
            -destination "id=$udid" -only-testing:FinePrintTests CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "✔|✘|error:|Test run|TEST (SUCCEEDED|FAILED)|passed|failed" | tail -150
